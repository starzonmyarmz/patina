name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle-universal patina --release
      - name: Zip
        run: |
          mkdir dist
          cd target/bundled
          ditto -c -k --keepParent Patina.vst3 ../../dist/Patina-macOS-VST3.zip
          ditto -c -k --keepParent Patina.clap ../../dist/Patina-macOS-CLAP.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle patina --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Compress-Archive -Path target/bundled/Patina.vst3 -DestinationPath dist/Patina-Windows-VST3.zip
          Compress-Archive -Path target/bundled/Patina.clap -DestinationPath dist/Patina-Windows-CLAP.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}."
