name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle-universal patina --release
      - name: Zip
        run: |
          mkdir -p stage/macOS dist
          cp -R target/bundled/Patina.vst3 target/bundled/Patina.clap stage/macOS/
          ditto -c -k --norsrc --noextattr --noacl --keepParent stage/macOS dist/macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle patina --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/Windows, dist
          Copy-Item -Recurse target/bundled/Patina.vst3, target/bundled/Patina.clap stage/Windows
          Compress-Archive -Path stage/Windows -DestinationPath dist/windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Zip
        run: |
          mkdir stage
          unzip -q dist/macos.zip -d stage
          unzip -q dist/windows.zip -d stage
          cp INSTALL.txt stage/
          cd stage
          zip -qry ../Patina.zip INSTALL.txt macOS Windows
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Patina.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}."
