name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo xtask bundle patina --release
      - run: scripts/clap-validator.sh target/bundled/Patina.clap
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bundle patina --release
      - run: scripts/clap-validator.sh target/bundled/Patina.clap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
