[package]
name = "patina"
version.workspace = true
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug = { git = "https://github.com/starzonmyarmz/nice-plug", rev = "d1f60d25612cc22383f5952ae285638a58903bab", features = ["assert_process_allocs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
baseview = "0.4.1"
wry = "0.57"
raw-window-handle = "0.6"
keyboard-types = { version = "0.8", default-features = false }
midir = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
