[workspace]
resolver = "2"
members = ["app", "plugin", "presetgen", "xtask"]
exclude = ["vendor"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch."https://github.com/robbert-vdh/nih-plug"]
nih_plug = { path = "vendor/nih_plug" }

# Old objc-based crates message nil, which Objective-C allows but Rust's
# debug-build null checks turn into aborts.
[profile.dev.package.objc]
debug-assertions = false
[profile.dev.package.baseview]
debug-assertions = false
[profile.dev.package.wry]
debug-assertions = false
