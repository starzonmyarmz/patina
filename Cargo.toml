[workspace]
resolver = "2"
members = ["plugin", "presetgen", "xtask"]
exclude = ["vendor"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch."https://github.com/robbert-vdh/nih-plug"]
nih_plug = { path = "vendor/nih_plug" }
