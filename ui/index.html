<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1000 Synths</title>
<style>
  :root {
    --panel: #e8e6e1;
    --panel-edge: #d6d3cc;
    --ink: #1d1d1b;
    --muted: #8a877f;
    --screen: #0d0d0d;
    --orange: #ff5a1f;
    --blue: #2f6cf6;
    --knob-size: 96px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--panel);
    color: var(--ink);
    font: 11px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.04em;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  main {
    display: grid;
    gap: 24px;
    place-content: center;
    justify-items: center;
    height: 100%;
  }

  .screen {
    background: var(--screen);
    color: #f2f2f2;
    border-radius: 6px;
    padding: 12px 16px;
    width: 320px;
    box-shadow: inset 0 2px 6px rgb(0 0 0 / 0.6);

    & .label { color: var(--orange); text-transform: uppercase; }
    & .value { font-size: 20px; }
  }

  .knob {
    display: grid;
    gap: 8px;
    justify-items: center;
    touch-action: none;
    cursor: ns-resize;

    & .cap {
      width: var(--knob-size);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5b8cff, var(--blue) 55%, #1f4fc0);
      box-shadow:
        0 6px 10px rgb(0 0 0 / 0.25),
        0 1px 0 rgb(255 255 255 / 0.6) inset,
        0 -3px 6px rgb(0 0 0 / 0.25) inset;
      position: relative;
    }

    & .cap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      rotate: calc(-135deg + var(--turn, 0.5) * 270deg);
      background: linear-gradient(#fff, #fff) center 8px / 4px 22% no-repeat;
    }

    &:focus-visible .cap {
      outline: 2px solid var(--orange);
      outline-offset: 4px;
    }

    & .name { color: var(--muted); text-transform: uppercase; }
  }

  .choices {
    display: flex;
    gap: 6px;

    & button {
      font: inherit;
      letter-spacing: inherit;
      border: 0;
      border-radius: 4px;
      padding: 6px 10px;
      background: var(--panel-edge);
      color: var(--ink);
      box-shadow: 0 2px 0 rgb(0 0 0 / 0.15);
    }

    & button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--panel);
    }
  }
</style>
</head>
<body>
<main>
  <section class="screen" aria-live="polite">
    <div class="label" id="screen-label">Cutoff</div>
    <div class="value" id="screen-value">—</div>
  </section>

  <div class="knob" role="slider" tabindex="0" aria-label="Cutoff" data-param="flt_cutoff">
    <div class="cap"></div>
    <div class="name">Cutoff</div>
  </div>

  <div class="choices" role="group" aria-label="Filter type" data-param="flt_type"></div>
</main>

<script>
  const params = new Map();
  const dragging = new Set();
  const views = new Map();

  const bridge = window.ipc
    ? (msg) => window.ipc.postMessage(JSON.stringify(msg))
    : mockBridge();

  function mockBridge() {
    const values = {};
    const reply = (msg) => setTimeout(() => window.onPluginMessage(msg));
    const text = (id, v) => id === "flt_cutoff" ? `${Math.round(20 * 1000 ** Math.sqrt(v))} Hz` : String(v);
    return (msg) => {
      if (msg.type === "ready") {
        reply({ type: "init", params: [
          { id: "flt_cutoff", name: "Cutoff", kind: "float", steps: 0, default: 0.5 },
          { id: "flt_type", name: "Filter type", kind: "enum", steps: 4,
            options: ["Lowpass", "Ladder", "Comb", "Formant", "Off"], default: 0 },
        ] });
        reply({ type: "values", values: [
          { id: "flt_cutoff", value: 0.5, text: text("flt_cutoff", 0.5) },
          { id: "flt_type", value: 0, text: "Lowpass" },
        ] });
      }
      if (msg.type === "set") {
        values[msg.id] = msg.value;
        reply({ type: "values", values: [{ id: msg.id, value: msg.value, text: text(msg.id, msg.value) }] });
      }
    };
  }

  addEventListener("pointerdown", () => bridge({ type: "focus" }), true);
  addEventListener("focusin", () => bridge({ type: "keys", active: true }));
  addEventListener("focusout", (e) => {
    if (!e.relatedTarget) bridge({ type: "keys", active: false });
  });

  window.onPluginMessage = (msg) => {
    if (msg.type === "key") {
      const { event, ...init } = msg;
      delete init.type;
      (document.activeElement ?? document.body).dispatchEvent(
        new KeyboardEvent(event, { ...init, bubbles: true, cancelable: true }),
      );
      return;
    }
    if (msg.type === "init") {
      msg.params.forEach((p) => params.set(p.id, { ...p, value: p.default, text: "" }));
      buildChoices();
    }
    if (msg.type === "values") {
      for (const { id, value, text } of msg.values) {
        const p = params.get(id);
        if (!p) continue;
        p.text = text;
        if (!dragging.has(id)) p.value = value;
        views.get(id)?.(p);
      }
    }
  };

  function setParam(id, value) {
    const p = params.get(id);
    if (!p) return;
    p.value = Math.min(1, Math.max(0, value));
    bridge({ type: "set", id, value: p.value });
    views.get(id)?.(p);
  }

  function gesture(id, fn) {
    bridge({ type: "begin", id });
    fn();
    bridge({ type: "end", id });
  }

  function showOnScreen(p) {
    document.getElementById("screen-label").textContent = p.name;
    document.getElementById("screen-value").textContent = p.text || "—";
  }

  const knob = document.querySelector(".knob");
  const knobId = knob.dataset.param;
  views.set(knobId, (p) => {
    knob.style.setProperty("--turn", p.value.toFixed(4));
    knob.setAttribute("aria-valuenow", p.value.toFixed(3));
    knob.setAttribute("aria-valuetext", p.text);
    showOnScreen(p);
  });

  knob.addEventListener("pointerdown", (e) => {
    const p = params.get(knobId);
    if (!p) return;
    knob.setPointerCapture(e.pointerId);
    dragging.add(knobId);
    bridge({ type: "begin", id: knobId });
    let lastY = e.clientY;
    const move = (ev) => {
      const fine = ev.shiftKey ? 0.2 : 1;
      setParam(knobId, p.value + ((lastY - ev.clientY) / 200) * fine);
      lastY = ev.clientY;
    };
    const up = () => {
      knob.removeEventListener("pointermove", move);
      knob.removeEventListener("pointerup", up);
      knob.removeEventListener("pointercancel", up);
      dragging.delete(knobId);
      bridge({ type: "end", id: knobId });
    };
    knob.addEventListener("pointermove", move);
    knob.addEventListener("pointerup", up);
    knob.addEventListener("pointercancel", up);
  });

  knob.addEventListener("dblclick", () => {
    const p = params.get(knobId);
    if (p) gesture(knobId, () => setParam(knobId, p.default));
  });

  knob.addEventListener("keydown", (e) => {
    const p = params.get(knobId);
    const step = { ArrowUp: 0.01, ArrowRight: 0.01, ArrowDown: -0.01, ArrowLeft: -0.01 }[e.key];
    if (!p || step === undefined) return;
    e.preventDefault();
    gesture(knobId, () => setParam(knobId, p.value + step * (e.shiftKey ? 10 : 1)));
  });

  function buildChoices() {
    const group = document.querySelector(".choices");
    const id = group.dataset.param;
    const p = params.get(id);
    if (!p) return;
    group.replaceChildren(...p.options.map((name, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.addEventListener("click", () => gesture(id, () => setParam(id, i / p.steps)));
      return button;
    }));
    views.set(id, (p) => {
      const index = Math.round(p.value * p.steps);
      [...group.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === index)));
      showOnScreen(p);
    });
  }

  bridge({ type: "ready" });
</script>
</body>
</html>
