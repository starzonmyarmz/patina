[package]
name = "patina-app"
version.workspace = true
edition = "2021"
publish = false

[[bin]]
name = "patina-app"
path = "src/main.rs"

[dependencies]
patina = { path = "../plugin" }
nice-plug = { git = "https://github.com/starzonmyarmz/nice-plug", rev = "d1f60d25612cc22383f5952ae285638a58903bab", features = ["standalone"] }
cpal = "0.18.2"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
