[package]
name = "patina-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "patina-app"
path = "src/main.rs"

[dependencies]
patina = { path = "../plugin" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["standalone"] }
cpal = "0.15"
midir = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
